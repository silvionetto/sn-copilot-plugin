name: Validate Plugin

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate manifests and documentation
        shell: bash
        run: |
          python <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(".")
          plugin_path = root / "plugin.json"
          packaged_plugin_path = root / ".github" / "plugin" / "plugin.json"
          marketplace_path = root / ".github" / "plugin" / "marketplace.json"
          readme_path = root / "README.md"
          agents_dir = root / "agents"
          runtime_agents_dir = root / "com.github.copilot" / "agents"
          packaged_agents_dir = root / ".github" / "plugin" / "agents"
          packaged_runtime_agents_dir = root / ".github" / "plugin" / "com.github.copilot" / "agents"
          skills_dir = root / "skills"
          packaged_skills_dir = root / ".github" / "plugin" / "skills"

          plugin = json.loads(plugin_path.read_text(encoding="utf-8"))
          packaged_plugin = json.loads(packaged_plugin_path.read_text(encoding="utf-8"))
          marketplace = json.loads(marketplace_path.read_text(encoding="utf-8"))
          readme = readme_path.read_text(encoding="utf-8")

          errors = []

          if plugin != packaged_plugin:
              errors.append("plugin.json and .github/plugin/plugin.json must be identical")

          if marketplace.get("name") != "sn-copilot-plugin-marketplace":
              errors.append(
                  f"Unexpected marketplace name: {marketplace.get('name')}"
              )

          marketplace_metadata = marketplace.get("metadata", {})
          if plugin.get("version") != marketplace_metadata.get("version"):
              errors.append(
                  f"Version mismatch: plugin.json={plugin.get('version')} "
                  f"marketplace metadata={marketplace_metadata.get('version')}"
              )

          owner = marketplace.get("owner", {})
          if owner.get("name") != plugin.get("author", {}).get("name"):
              errors.append("Marketplace owner name must match plugin author name")

          plugins = marketplace.get("plugins")
          if not isinstance(plugins, list) or len(plugins) != 1:
              errors.append("marketplace.json must publish exactly one plugin entry")
              marketplace_plugin = {}
          else:
              marketplace_plugin = plugins[0]

          if marketplace_plugin.get("name") != plugin.get("name"):
              errors.append("Marketplace plugin name must match plugin.json name")

          if marketplace_plugin.get("description") != plugin.get("description"):
              errors.append("Marketplace plugin description must match plugin.json description")

          if marketplace_plugin.get("version") != plugin.get("version"):
              errors.append("Marketplace plugin version must match plugin.json version")

          if marketplace_plugin.get("source") != ".github/plugin":
              errors.append("Marketplace plugin source must point to the packaged plugin root '.github/plugin'")

          marketplace_author = marketplace_plugin.get("author", {})
          if marketplace_author.get("name") != plugin.get("author", {}).get("name"):
              errors.append("Marketplace plugin author name must match plugin.json author name")

          if marketplace_plugin.get("license") != plugin.get("license"):
              errors.append("Marketplace plugin license must match plugin.json license")

          plugin_extension = plugin.get("extensions", {}).get("com.github.awesome-copilot", {})
          if plugin_extension.get("agents") != ["agents/"]:
              errors.append("plugin.json must register agents/ as the agent discovery path")

          if plugin_extension.get("skills") != ["skills/"]:
              errors.append("plugin.json must register skills/ as the skill discovery path")

          agent_files = sorted(path.name for path in agents_dir.glob("*.agent.md"))
          if not agent_files:
              errors.append("No agent files found under agents/")

          packaged_agent_files = sorted(path.name for path in packaged_agents_dir.glob("*.agent.md"))
          if agent_files != packaged_agent_files:
              errors.append("Packaged agents under .github/plugin/agents must mirror agents/")
          else:
              for agent_file in agent_files:
                  root_agent = (agents_dir / agent_file).read_text(encoding="utf-8")
                  packaged_agent = (packaged_agents_dir / agent_file).read_text(encoding="utf-8")
                  if root_agent != packaged_agent:
                      errors.append(f"Packaged agent content mismatch for {agent_file}")

          runtime_agent_files = sorted(path.name for path in runtime_agents_dir.glob("*.md"))
          expected_runtime_agent_files = [path.replace(".agent.md", ".md") for path in agent_files]
          if runtime_agent_files != expected_runtime_agent_files:
              errors.append("Runtime agents under com.github.copilot/agents must mirror agents/")
          else:
              for agent_file in agent_files:
                  root_agent = (agents_dir / agent_file).read_text(encoding="utf-8")
                  runtime_agent = (runtime_agents_dir / agent_file.replace(".agent.md", ".md")).read_text(encoding="utf-8")
                  if root_agent != runtime_agent:
                      errors.append(f"Runtime agent content mismatch for {agent_file}")

          packaged_runtime_agent_files = sorted(path.name for path in packaged_runtime_agents_dir.glob("*.md"))
          if packaged_runtime_agent_files != expected_runtime_agent_files:
              errors.append("Packaged runtime agents under .github/plugin/com.github.copilot/agents must mirror agents/")
          else:
              for agent_file in agent_files:
                  root_agent = (agents_dir / agent_file).read_text(encoding="utf-8")
                  packaged_runtime_agent = (
                      packaged_runtime_agents_dir / agent_file.replace(".agent.md", ".md")
                  ).read_text(encoding="utf-8")
                  if root_agent != packaged_runtime_agent:
                      errors.append(f"Packaged runtime agent content mismatch for {agent_file}")

          if not skills_dir.exists():
              errors.append("skills/ directory is missing")

          if not packaged_skills_dir.exists():
              errors.append(".github/plugin/skills/ directory is missing")

          missing_agent_commands = []
          for agent_file in agent_files:
              agent_name = agent_file.replace(".agent.md", "")
              command = f"/agent {agent_name}"
              if command not in readme:
                  missing_agent_commands.append(command)

          if missing_agent_commands:
              errors.append(
                  "README.md is missing agent command entries: " + ", ".join(missing_agent_commands)
              )

          version_match = re.search(r"- \*\*Version:\*\* `([^`]+)`", readme)
          if not version_match:
              errors.append("README.md is missing the Current manifest version line")
          elif version_match.group(1) != plugin.get("version"):
              errors.append(
                  f"README.md version {version_match.group(1)} does not match plugin.json version {plugin.get('version')}"
              )

          if ".github/plugin/plugin.json" not in readme:
              errors.append("README.md must document the packaged plugin manifest path")

          if "Marketplace installs now point at `.github/plugin`" not in readme:
              errors.append("README.md must explain the packaged marketplace layout")

          if "com.github.copilot/agents" not in readme:
              errors.append("README.md must document the com.github.copilot/agents runtime path")

          if "sn-copilot-plugin:project-manager" not in readme:
              errors.append("README.md must document the installed plugin namespace for agent IDs")

          if errors:
              for error in errors:
                  print(f"ERROR: {error}")
              sys.exit(1)

          print(f"Validated {len(agent_files)} agents, packaged plugin parity, and README consistency.")
          PY
